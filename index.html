<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-default>DineScan — Scan. Order. Enjoy.</title>
    <meta property="og:image" content="/dinescan-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/dinescan-logo.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dinescan_theme_color');
          if (saved) {
            document.documentElement.style.setProperty('--primary-color', saved);
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
